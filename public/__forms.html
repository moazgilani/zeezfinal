<!doctype html>
<html lang="en">
  <body>
    <form name="book-a-call" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="book-a-call" />
      <input type="hidden" name="subject" value="New book-a-call request from %{formName} (%{submissionId})" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="project-type"><option>Interior design</option></select>
      <input name="preferred-date" type="date" />
      <textarea name="project-details"></textarea>
    </form>
  </body>
</html>
